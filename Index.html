<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiktok Clone</title>
    <link rel="stylesheet" href="Style.css">
    <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"> -->
</head>
<body>
    <div class="logo">
        <a href="Index.html"><img src="Tiktok logo.png" alt="Tiktok Logo" width="90" height="45"></a>
    </div>
    <p>
       <a href="Feedback.html"><img src="question.png" alt="Google Icon" width="12" height="12" align="absmiddle";"> Feedback and help</a>
    </p>
    <div class="tiktok">
        Log in to TikTok
    </div>
    <div class="tiktok2">
        Manage your account, check notifications,<br> comment on videos, and more.
    </div>

    <div class="container">
         <button class="QR"> <a href=""> <img src="qr-code-scan.png" alt="QR Code Icon" width="12" height="12" align="absmiddle" margin="0" style="margin-right: 70px;"> Use QR code </a></button>

         <button class="Phone"> <a href=""> <img src="user Icon.png" alt="User Icon" width="12" height="12" align="absmiddle" margin="0" style="margin-right: 36px;"> Use phone / email / username </a></button>

         <button class="Fb"> <a href=""> <img src="facebook.png" alt="Facebook Logo" width="12" height="12" align="absmiddle" margin="0" style="margin-right: 43px;"> Continue with Facebook </a></button>

         <button class="Google"> <a href=""> <img src="Google logo.png" alt="Google Logo" width="12" height="12" align="absmiddle" margin="0" style="margin-right: 50px;"> Continue with Google </a></button>

         <button class="Apple"> <a href=""> <img src="Apple logo.png" alt="Apple Logo" width="12" height="12" align="absmiddle" margin="0" style="margin-right: 50px;"> Continue with Apple </a></button>
    </div>

    <div class="tiktok3">
        By continuing with an account located in <a href="Privacy Policy.html">Nigeria</a>, you agree<br> to our <a href="Terms of Service.html">Terms of Service</a> and acknowledge that you have read<br> our <a href="Privacy Policy.html">Privacy Policy</a>.
    </div>

    <hr>

    <div class="tiktok4">
        Don't have an account? <a href="Signup.html" style="text-decoration: none; color: red;">Sign up</a>
    </div>

    <footer>
        <button class="Lang">English (US)</button>
        <div class="Cop">
            © 2026 TikTok
        </div>
    </footer>

</html>
